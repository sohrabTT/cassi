[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cassi-spec"
version = "0.1.0"
description = "Confidence-Adaptive Speculative Inference: a backend-agnostic framework for speculative decoding with adaptive draft length, cross-request pipelining, and smart rollback."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sohrab", email = "sohrab@example.com"}
]
keywords = [
    "speculative-decoding",
    "llm",
    "inference",
    "acceleration",
    "kv-cache",
    "transformer",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.0.0", "transformers>=4.35.0"]
viz = ["matplotlib>=3.7.0", "numpy>=1.24.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0", "mypy>=1.5"]
all = ["cassi-spec[torch,viz,dev]"]

[project.urls]
Homepage = "https://github.com/sohrab/cassi"
Documentation = "https://github.com/sohrab/cassi#readme"
Issues = "https://github.com/sohrab/cassi/issues"

[tool.setuptools.packages.find]
include = ["cassi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = false
warn_unused_configs = true
